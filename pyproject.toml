[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "1.0.0"
description = "Rule-based threat detection for Linux, Windows and web logs, mapped to MITRE ATT&CK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abhishek Joshi"}]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["logsentinel*"]

[tool.setuptools.package-data]
logsentinel = ["ruleset/*.json"]
